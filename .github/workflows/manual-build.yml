name: Publish manual

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_IMAGE: kubectl-with-envsubst
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Get image metadata
        id: versioning
        run: |
          docker pull bitnamisecure/kubectl:${{ github.event.inputs.version }}
          latest_version=$(docker image inspect bitnamisecure/kubectl:${{ github.event.inputs.version }} --format '{{ index .Config.Labels "org.opencontainers.image.version"}}')
            echo "latest_version=$latest_version" >> $GITHUB_OUTPUT
          latest_sha=$(docker image inspect bitnamisecure/kubectl:${{ github.event.inputs.version }} --format '{{ index .Id }}' | sed 's/sha256:/sha256-/')
            echo "latest_sha=$latest_sha" >> $GITHUB_OUTPUT

      - name: Test image metadata
        run: |
          echo ${{ steps.versioning.outputs.latest_version }}
          echo ${{ steps.versioning.outputs.latest_sha }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.versioning.outputs.latest_sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE }}:${{ steps.versioning.outputs.latest_sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE }}:${{ steps.versioning.outputs.latest_version }}
