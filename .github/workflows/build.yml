name: Publisher

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_IMAGE: kubectl-with-envsubst
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Get correct semvers
        id: versioning
        run: |
          docker pull bitnami/kubectl:latest
          latest_version=$(docker image inspect bitnami/kubectl:latest --format '{{ index .Config.Labels "org.opencontainers.image.version"}}')
            echo "latest_version=$latest_version" >> $GITHUB_OUTPUT

      - name: Test data
        run: |
          echo ${{ steps.versioning.outputs.latest_version }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.versioning.outputs.latest_version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE }}:${{ steps.versioning.outputs.latest_version }}