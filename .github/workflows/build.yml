name: Publish automated

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_IMAGE: kubectl-with-envsubst
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Get correct semvers
        id: versioning
        run: |
          docker pull bitnami/kubectl:latest
          latest_version=$(docker image inspect bitnami/kubectl:latest --format '{{ index .Config.Labels "org.opencontainers.image.version"}}')
            echo "latest_version=$latest_version" >> $GITHUB_OUTPUT
          latest_sha=$(docker image inspect bitnami/kubectl:latest --format '{{ index .Id }}' | sed 's/sha256:/sha256-/')
            echo "latest_sha=$latest_sha" >> $GITHUB_OUTPUT

      - name: Test data
        run: |
          echo ${{ steps.versioning.outputs.latest_version }}
          echo ${{ steps.versioning.outputs.latest_sha }}

      - name: Check if version is already published
        id: check
        run: |
          exists=$(curl -s -o /dev/null -w "%{http_code}" https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE }}/tags/${{ steps.versioning.outputs.latest_sha }})
          echo "exists=$exists" >> $GITHUB_OUTPUT
          if [ $exists -eq 200 ]; then
            echo "Version already exists"
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        if: steps.check.outputs.exists != '200'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.versioning.outputs.latest_version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE }}:${{ steps.versioning.outputs.latest_sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE }}:${{ steps.versioning.outputs.latest_version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE }}:latest
